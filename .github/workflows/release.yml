name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to embed (defaults to tag name or 0.1.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish Windows binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Windows resource toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18
          mkdir -p "$HOME/.local/bin"
          if ! command -v llvm-windres >/dev/null 2>&1; then
            ln -sf "$(command -v llvm-windres-18)" "$HOME/.local/bin/llvm-windres"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v llvm-windres || command -v llvm-windres-18

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_name="${GITHUB_REF_NAME}"
            prerelease=false
          else
            version="${{ inputs.version }}"
            if [[ -z "$version" ]]; then version="0.1.0"; fi
            release_name="manual-${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi
          commit="$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify source tree
        run: make verify

      - name: Build Windows ARM64
        run: make windows-arm64 VERSION='${{ steps.meta.outputs.version }}' COMMIT='${{ steps.meta.outputs.commit }}'

      - name: Build Windows Intel x64
        run: make windows-intel VERSION='${{ steps.meta.outputs.version }}' COMMIT='${{ steps.meta.outputs.commit }}'

      - name: Package artifacts
        shell: bash
        run: |
          make sha256
          ls -lh dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.release_name }}
          name: womprat ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/womprat-windows-arm64.exe
            dist/womprat-windows-amd64.exe
            dist/SHA256SUMS.txt
