name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to embed (defaults to tag name or Makefile version)'
        required: false
        type: string
      validate_only:
        description: 'Run release checks and builds without publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Portable resolver normally selects RUNNER_TEMP/womprat on hosted runners.
# All project commands source scripts/paths.sh. Profiles are short-lived analysis
# inputs; delete the CI artifacts after review, retaining concise conclusions only.
defaults:
  run:
    shell: bash

jobs:
  linux-appimage:
    name: Validate Linux browser parity and AppImage
    uses: ./.github/workflows/linux-appimage.yml
    with:
      version: ${{ inputs.version || '' }}

  publish-linux:
    name: Add validated AppImage to release
    needs: [linux-appimage, build-release]
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Initialise project run paths
        run: |
          source scripts/paths.sh
          echo "WOMPRAT_DIST=$WOMPRAT_BUILD_DIR/dist" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-release
          path: ${{ env.WOMPRAT_DIST }}
      - name: Verify accepted artifact checksums
        run: |
          source scripts/paths.sh
          cd "$WOMPRAT_BUILD_DIR/dist"
          sha256sum --check LINUX-SHA256SUMS.txt
      - name: Publish accepted Linux assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          files: |
            ${{ env.WOMPRAT_DIST }}/Womprat-*-x86_64.AppImage
            ${{ env.WOMPRAT_DIST }}/LINUX-SHA256SUMS.txt
          fail_on_unmatched_files: true

  windows-tests:
    name: Execute Windows COM regression tests (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Initialise project run paths
        run: |
          source scripts/paths.sh
          echo "WOMPRAT_RUN_DIR=$WOMPRAT_RUN_DIR" >> "$GITHUB_ENV"
      - name: Test local WebView2 bindings with CPU and allocation profiles
        run: bash scripts/test-profile.sh webview2 internal/go-webview2 ./pkg/edge -v -count=20
      - name: Upload transient Windows profiles for current analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-profiles-${{ matrix.arch }}
          path: ${{ env.WOMPRAT_RUN_DIR }}/profiles/
          retention-days: 1
          if-no-files-found: error

  build-release:
    name: Build and publish Windows binaries
    needs: windows-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Windows resource toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18
          mkdir -p "$HOME/.local/bin"
          if ! command -v llvm-windres >/dev/null 2>&1; then
            ln -sf "$(command -v llvm-windres-18)" "$HOME/.local/bin/llvm-windres"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v llvm-windres || command -v llvm-windres-18

      - name: Compute release metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_name="${GITHUB_REF_NAME}"
            prerelease=false
          else
            version="$INPUT_VERSION"
            if [[ -z "$version" ]]; then version="$(awk '/^VERSION[[:space:]]/ {print $3; exit}' Makefile)"; fi
            release_name="manual-${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid release version' >&2
            exit 1
          fi
          commit="$(git rev-parse --short HEAD)"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Initialise project run paths
        run: |
          source scripts/paths.sh
          echo "WOMPRAT_RUN_DIR=$WOMPRAT_RUN_DIR" >> "$GITHUB_ENV"

      - name: Verify source tree
        run: make verify PROFILE=1

      - name: Build Windows ARM64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: make windows-arm64 VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Build Windows Intel x64
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: make windows-intel VERSION="$VERSION" COMMIT="$COMMIT"

      - name: Package artifacts
        shell: bash
        run: |
          source scripts/paths.sh
          make sha256
          echo "WOMPRAT_DIST=$WOMPRAT_BUILD_DIR/dist" >> "$GITHUB_ENV"
          ls -lh "$WOMPRAT_BUILD_DIR/dist"

      - name: Select release notes
        id: notes
        env:
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          notes="docs/releases/$RELEASE_NAME.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: ${{ !inputs.validate_only }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.release_name }}
          name: womprat ${{ github.ref_type == 'tag' && github.ref_name || steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            ${{ env.WOMPRAT_DIST }}/womprat-windows-arm64.exe
            ${{ env.WOMPRAT_DIST }}/womprat-windows-amd64.exe
            ${{ env.WOMPRAT_DIST }}/SHA256SUMS.txt

      - name: Upload transient Linux profiles for current analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-profiles
          path: ${{ env.WOMPRAT_RUN_DIR }}/profiles/
          retention-days: 1
          if-no-files-found: error
