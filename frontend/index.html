<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>womprat</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
@font-face {
  font-family: 'FiraCode Nerd Font Mono';
  src: url('fonts/FiraCodeNerdFontMono-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: block;
}
@font-face {
  font-family: 'FiraCode Nerd Font Mono';
  src: url('fonts/FiraCodeNerdFontMono-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: block;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#202020;
  --surface:rgba(32,32,32,.7);
  --surface-solid:#2d2d2d;
  --card:#2d2d2d;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --text:#fff;
  --text-secondary:rgba(255,255,255,.78);
  --dim:rgba(255,255,255,.55);
  --accent:#60cdff;
  --accent-hover:rgba(96,205,255,.15);
  --subtle-hover:rgba(255,255,255,.06);
  --subtle-pressed:rgba(255,255,255,.04);
  --layer:rgba(255,255,255,.05);
  --radius:4px;
  --radius-lg:8px;
  --tab-h:40px;
  --url-h:44px;
  --control-h:32px;
  --font:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;
}
html{font-size:100%;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* Fluent reveal hover effect */
button,a,.tab,.recent-item,.peer-item,.option{
  transition:background .1s,border-color .15s,color .1s}
.fluent-icon{width:20px;height:20px;display:inline-block;flex:0 0 20px;color:currentColor;vertical-align:middle}
.fluent-icon svg{width:100%;height:100%;display:block}
.icon-button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-secondary);
  cursor:pointer;padding:0;flex:0 0 auto}
.icon-button:hover{background:var(--subtle-hover);color:var(--text)}

/* Tab bar — Fluent */
#tab-bar{display:flex;height:var(--tab-h);background:var(--surface-solid);
  border-bottom:1px solid var(--border);
  -webkit-app-region:drag;user-select:none;align-items:center;padding:0 8px;gap:2px}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;height:32px;border-radius:var(--radius);
  cursor:pointer;color:var(--dim);font-weight:400;-webkit-app-region:no-drag;line-height:32px;font-size:14px;min-width:0}
.tab:hover{background:var(--subtle-hover);color:var(--text)}
.tab.active{background:var(--layer);color:var(--text);font-weight:600}
.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-close{margin-left:4px;opacity:.55;color:var(--dim);cursor:pointer;border-radius:4px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px}
.tab-close .fluent-icon{width:16px;height:16px}
.tab-close:hover{opacity:1;color:var(--text);background:var(--subtle-hover)}
#new-tab{width:32px;height:32px;-webkit-app-region:no-drag}
#new-tab .fluent-icon{width:20px;height:20px}

/* Panels */
#panels{position:absolute;inset:calc(var(--tab-h) + var(--url-h)) 0 0 0}
.panel{position:absolute;inset:0;display:none}
.panel.active{display:flex;flex-direction:column}

/* Terminal panel */
.term-panel .xterm{flex:1}

/* Local panels */
.browser-panel{flex-direction:column}
.browser-frame{flex:1;border:none}

/* Setup screen */
#setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:100}
#setup.hidden{display:none}
.setup-card{background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:2rem;width:min(400px,90vw);text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.4)}
.setup-card h2{font-size:1.2rem;margin-bottom:.5rem}
.setup-card p{color:var(--dim);font-size:.85rem;margin-bottom:1.2rem;line-height:1.5}
.setup-card input{width:100%;padding:.6rem .8rem;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:monospace;font-size:.85rem;margin-bottom:.8rem}
.setup-card button{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.55rem 1.2rem;font-weight:600;cursor:pointer;font-size:.85rem}
.setup-card .status{margin-top:.8rem;font-size:.82rem;color:var(--dim)}

/* Peer list (new tab menu) */

#url-bar{display:flex;gap:6px;height:var(--url-h);padding:6px 8px;background:var(--surface-solid);
  border-bottom:1px solid var(--border);align-items:center;position:relative;z-index:10}
#url-bar input{flex:1;min-width:0;height:var(--control-h);background:var(--layer);border:1px solid var(--border);border-radius:var(--radius);
  padding:0 10px;color:var(--text);font-family:var(--font);font-size:14px;line-height:var(--control-h);outline:none;color-scheme:dark}
#url-bar input:focus{border-color:var(--accent);background:var(--bg)}
#url-bar button{height:var(--control-h)}
#url-bar .icon-button{min-width:32px;padding:0}
#url-bar .text-button{min-width:44px;padding:0 12px;font-size:14px;font-weight:600;line-height:var(--control-h)}
#url-bar .fluent-icon{width:20px;height:20px}

#peer-menu{position:absolute;top:var(--tab-h);right:.5rem;background:var(--card);
  border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:.4rem;z-index:50;
  min-width:240px;display:none;max-height:60vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.4)}
#peer-menu.show{display:block}
.recent-item{display:flex;align-items:center;gap:.6rem;padding:.65rem .85rem;
  border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.85em}
.recent-item:hover{background:var(--subtle-hover);border-color:var(--border-strong)}
.peer-item{display:flex;align-items:center;gap:.5rem;padding:.45rem .6rem;border-radius:var(--radius);cursor:pointer;font-size:.82em}
.peer-item:hover{background:var(--subtle-hover)}
.peer-dot{width:8px;height:8px;border-radius:50%}
.peer-dot.online{background:#3fb950}
.peer-dot.offline{background:var(--dim)}
.peer-actions{margin-left:auto;display:flex;gap:.3rem}
.peer-actions button{background:none;border:1px solid var(--border);border-radius:4px;
  padding:.15rem .4rem;font-size:.72rem;color:var(--dim);cursor:pointer}
.peer-actions button:hover{color:var(--accent);border-color:var(--accent)}

#download-bar{position:fixed;bottom:0;left:0;right:0;height:2.5em;
  background:var(--surface-solid);border-top:1px solid var(--border);
  display:none;align-items:center;padding:0 1rem;gap:.8rem;font-size:.82em;z-index:60}
#download-bar.active{display:flex}
#download-bar .filename{font-weight:600;color:var(--text)}
#download-bar .progress{flex:1;height:4px;background:var(--layer);border-radius:2px;overflow:hidden}
#download-bar .progress-fill{height:100%;background:var(--accent);transition:width .2s}
#download-bar .status{color:var(--dim)}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h2>womprat</h2>
    <p>Enter your Tailscale auth key to connect.<br>It will be saved in your system keychain.</p>
    <input id="auth-key" type="password" placeholder="tskey-auth-...">
    <button onclick="saveKey()">Connect</button>
    <div class="status" id="setup-status"></div>
  </div>
</div>

<div id="tab-bar">
  <button id="new-tab" class="icon-button" onclick="togglePeerMenu()" title="New tab" aria-label="New tab" data-icon="add"></button>
  <div style="margin-left:auto;display:flex;gap:4px">
    <button id="settings-btn" class="icon-button" onclick="openSettings()" title="Settings" aria-label="Settings" data-icon="settings"></button>
  </div>
</div>

<div id="peer-menu"></div>
<div id="url-bar">
  <button class="icon-button" onclick="historyBack(state.activeTab)" title="Back" aria-label="Back" data-icon="chevronLeft"></button>
  <button class="icon-button" onclick="historyForward(state.activeTab)" title="Forward" aria-label="Forward" data-icon="chevronRight"></button>
  <button class="icon-button" onclick="historyReload(state.activeTab)" title="Reload" aria-label="Reload" data-icon="arrowClockwise"></button>
  <input id="url-input" placeholder="Enter URL or ssh://user@host" onkeydown="if(event.key==='Enter')navigateFromBar()">
  <button class="icon-button text-button" onclick="navigateFromBar()">Go</button>
</div>

<div id="panels">
<!-- Home panel (shown when no tabs active) -->
<div class="panel active" id="panel-home">
  <div style="padding:2rem;max-width:500px;margin:0 auto">
    <h2 style="font-size:1.1em;margin-bottom:1rem;color:var(--dim)">Recent</h2>
    <div id="recent-list" style="display:flex;flex-direction:column;gap:.4rem"></div>
    <div style="margin-top:1.5rem;color:var(--dim);font-size:.82em">
      Use <kbd style="padding:2px 6px;background:var(--surface);border:1px solid var(--border);border-radius:4px">New tab</kbd> to connect to a peer, or type a URL in the address bar.
    </div>
  </div>
</div>
</div>

<script>
// Session auth token (injected by server)
const TOKEN = window.__SESSION_TOKEN || '';
const _fetch = window.fetch;
window.fetch = (url, opts = {}) => {
  opts.headers = opts.headers || {};
  if (typeof opts.headers === 'object' && !(opts.headers instanceof Headers)) {
    opts.headers['X-Session-Token'] = TOKEN;
  }
  return _fetch(url, opts);
};
</script>
<script type="module">

window.Terminal = Terminal;
window.FitAddon = FitAddon;
window.WebLinksAddon = WebLinksAddon;
window.AttachAddon = AttachAddon;
window.ClipboardAddon = ClipboardAddon;
window.SearchAddon = SearchAddon;
window.Unicode11Addon = Unicode11Addon;
window.UnicodeGraphemesAddon = UnicodeGraphemesAddon;
window.WebglAddon = WebglAddon;


const FLUENT_ICONS = {

  dismiss: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M4.22 4.22a.75.75 0 0 1 1.06 0L10 8.94l4.72-4.72a.75.75 0 1 1 1.06 1.06L11.06 10l4.72 4.72a.75.75 0 1 1-1.06 1.06L10 11.06l-4.72 4.72a.75.75 0 0 1-1.06-1.06L8.94 10 4.22 5.28a.75.75 0 0 1 0-1.06Z"/></svg>',
  settings: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M8.91 2.04a1.5 1.5 0 0 1 2.18 0l.45.48c.23.25.58.35.91.27l.64-.17a1.5 1.5 0 0 1 1.89 1.1l.16.64c.08.33.34.59.67.68l.64.17a1.5 1.5 0 0 1 1.09 1.89l-.18.64c-.09.32.01.67.26.9l.49.46a1.5 1.5 0 0 1 0 2.18l-.49.46a.95.95 0 0 0-.26.9l.18.64a1.5 1.5 0 0 1-1.09 1.89l-.64.17a.95.95 0 0 0-.67.68l-.16.64a1.5 1.5 0 0 1-1.89 1.1l-.64-.17a.95.95 0 0 0-.91.27l-.45.48a1.5 1.5 0 0 1-2.18 0l-.45-.48a.95.95 0 0 0-.91-.27l-.64.17a1.5 1.5 0 0 1-1.89-1.1l-.16-.64a.95.95 0 0 0-.67-.68l-.64-.17a1.5 1.5 0 0 1-1.09-1.89l.18-.64a.95.95 0 0 0-.26-.9l-.49-.46a1.5 1.5 0 0 1 0-2.18l.49-.46c.25-.23.35-.58.26-.9l-.18-.64a1.5 1.5 0 0 1 1.09-1.89l.64-.17c.33-.09.59-.35.67-.68l.16-.64a1.5 1.5 0 0 1 1.89-1.1l.64.17c.33.08.68-.02.91-.27l.45-.48ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>',
  globe: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16ZM4.08 9.25a6.5 6.5 0 0 1 2.1-4.2c-.4.94-.66 2.4-.72 4.2H4.08Zm0 1.5h1.38c.06 1.8.32 3.26.72 4.2a6.5 6.5 0 0 1-2.1-4.2Zm5.17 5.67c-.7-.55-1.2-2.73-1.3-5.67h2.6c-.1 2.94-.6 5.12-1.3 5.67Zm1.3-7.17h-2.6c.1-2.94.6-5.12 1.3-5.67.7.55 1.2 2.73 1.3 5.67Zm3.27 5.7c.4-.94.66-2.4.72-4.2h1.38a6.5 6.5 0 0 1-2.1 4.2Zm.72-5.7c-.06-1.8-.32-3.26-.72-4.2a6.5 6.5 0 0 1 2.1 4.2h-1.38Z"/></svg>',
  terminal: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M3.5 4A2.5 2.5 0 0 0 1 6.5v7A2.5 2.5 0 0 0 3.5 16h13a2.5 2.5 0 0 0 2.5-2.5v-7A2.5 2.5 0 0 0 16.5 4h-13ZM2.5 6.5c0-.55.45-1 1-1h13c.55 0 1 .45 1 1v7c0 .55-.45 1-1 1h-13c-.55 0-1-.45-1-1v-7Zm3.28 1.72a.75.75 0 0 0-1.06 1.06L6.44 11l-1.72 1.72a.75.75 0 1 0 1.06 1.06l2.25-2.25a.75.75 0 0 0 0-1.06L5.78 8.22ZM9.75 12a.75.75 0 0 0 0 1.5h4.5a.75.75 0 0 0 0-1.5h-4.5Z"/></svg>',
  chevronLeft: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M12.73 4.22a.75.75 0 0 1 .05 1.06L8.56 10l4.22 4.72a.75.75 0 1 1-1.12 1L7 10.53a.75.75 0 0 1 0-1.06l4.66-5.2a.75.75 0 0 1 1.07-.05Z"/></svg>',
  chevronRight: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M7.27 4.22a.75.75 0 0 0-.05 1.06L11.44 10l-4.22 4.72a.75.75 0 1 0 1.12 1L13 10.53a.75.75 0 0 0 0-1.06l-4.66-5.2a.75.75 0 0 0-1.07-.05Z"/></svg>',
  arrowClockwise: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M15.65 6.35A6.5 6.5 0 1 0 16.5 10a.75.75 0 0 1 1.5 0 8 8 0 1 1-2.34-5.66V3.25a.75.75 0 0 1 1.5 0v3.5c0 .41-.34.75-.75.75h-3.5a.75.75 0 0 1 0-1.5h2.74Z"/></svg>',
  home: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.28 2.78a1 1 0 0 1 1.44 0l6.5 6.78a.75.75 0 0 1-1.08 1.04l-.64-.67V16a2 2 0 0 1-2 2h-2.25a.75.75 0 0 1-.75-.75V13h-1v4.25a.75.75 0 0 1-.75.75H6.5a2 2 0 0 1-2-2V9.93l-.64.67a.75.75 0 1 1-1.08-1.04l6.5-6.78Z"/></svg>'
};
function icon(name) { return `<span class="fluent-icon">${FLUENT_ICONS[name] || ''}</span>`; }
function applyStaticIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.getAttribute('data-icon');
    if (name) el.innerHTML = icon(name);
  });
}

const state = { tabs: [], activeTab: null };
applyStaticIcons();

// Check auth status
async function checkAuth() {
  const res = await fetch('/api/auth/status');
  const data = await res.json();
  if (data.hasKey && data.connected) {
    document.getElementById('setup').classList.add('hidden');
    loadPeers();
  }
}

window.saveKey = async function() {
  const key = document.getElementById('auth-key').value.trim();
  const status = document.getElementById('setup-status');
  if (!key) { status.textContent = 'Please enter a key'; return; }
  status.textContent = 'Connecting...';
  const res = await fetch('/api/auth/save-key', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({key})
  });
  const data = await res.json();
  if (data.status === 'connected') {
    document.getElementById('setup').classList.add('hidden');
    loadPeers();
  } else {
    status.textContent = data.error || 'Failed to connect';
  }
};

async function loadPeers() {
  const res = await fetch('/api/tailscale/peers');
  const peers = await res.json();
  const menu = document.getElementById('peer-menu');
  menu.innerHTML = peers.map(p => `
    <div class="peer-item" data-host="${p.name}" data-ip="${p.ips[0] || ''}">
      <span class="peer-dot ${p.online?'online':'offline'}"></span>
      <span>${p.name}</span>
      <span style="color:var(--dim);font-size:.72rem">${p.os}</span>
      <div class="peer-actions">
        <button onclick="openTerminal('${p.ips[0] || p.name}','${p.name}','root',22)">SSH</button>
        <button onclick="openBrowser('http://${p.ips[0] || p.name}:8080','${p.name}')">Web</button>
      </div>
    </div>
  `).join('');
}

window.togglePeerMenu = function() {
  document.getElementById('peer-menu').classList.toggle('show');
};

window.openTerminal = async function(host, name, user, port) {
  document.getElementById('peer-menu').classList.remove('show');
  const tabId = `term-${Date.now()}`;
  const sshUser = user || 'root';
  const sshPort = port || 22;
  const tab = { id: tabId, type: 'terminal', title: name, host, user: sshUser, port: sshPort };
  state.tabs.push(tab);
  renderTabs();
  activateTab(tabId);
  saveOpenTabs(); updateHomeVisibility();

  const panel = document.getElementById(`panel-${tabId}`);
  const container = panel.querySelector('.term-container');

  // Create terminal immediately with "Connecting..." message
  const term = new Terminal({ allowProposedApi: true, cursorBlink: true, fontSize: 14, bellStyle: 'sound', copyOnSelect: true, rightClickSelectsWord: true,
    fontFamily: 'FiraCode Nerd Font Mono, monospace',
    fontWeight: '400', fontWeightBold: '700',
    theme: { background: '#202020', foreground: '#fff', cursor: '#60cdff',
             selectionBackground: 'rgba(96,205,255,.3)' }
  });
  const fit = new FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon());
  term.loadAddon(new ClipboardAddon());
  term.loadAddon(new SearchAddon());
  term.loadAddon(new Unicode11Addon());
  term.loadAddon(new UnicodeGraphemesAddon());
  try { term.loadAddon(new WebglAddon()); } catch(e) {}
  term.unicode.activeVersion = '11';
    // Search: Ctrl+Shift+F
    const searchAddon = term._addonManager?._addons?.find(a => a?.instance?.findNext) || null;
    term.attachCustomKeyEventHandler((ev) => {
      if (ev.ctrlKey && ev.shiftKey && ev.key === 'F') {
        // TODO: show search bar UI
        return false;
      }
      return true;
    });
    // Update tab title from terminal title sequences
    term.onTitleChange((title) => {
      const t = state.tabs.find(t => t.id === tabId);
      if (t && title) { t.title = title.slice(0, 30); renderTabs(); }
    });
  term.open(container);
  fit.fit();
  window.addEventListener('resize', () => { if (state.activeTab === tabId) fit.fit(); });

  term.write(`\x1b[2m Connecting to ${sshUser}@${host}:${sshPort}...\x1b[0m\r\n`);

  // Get initial dimensions
  const cols = term.cols;
  const rows = term.rows;

  // Connect SSH
  let res;
  try {
    res = await fetch('/api/ssh/connect', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ host, user: sshUser, port: sshPort, cols, rows })
    });
  } catch(err) {
    term.write(`\x1b[31m Connection failed: ${err.message}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, sshUser, sshPort);
    return;
  }

  if (!res.ok) {
    const errText = await res.text();
    term.write(`\x1b[31m SSH error: ${errText}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, sshUser, sshPort);
    return;
  }

  const data = await res.json();
  if (!data.tabId) {
    term.write(`\x1b[31m No session returned\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, sshUser, sshPort);
    return;
  }

  // Check if password is needed
  if (data.needsPassword) {
    term.write(`\x1b[33m Password required for ${sshUser}@${host}:\x1b[0m `);
    let password = '';
    const pwHandler = term.onData(ch => {
      if (ch === '\r' || ch === '\n') {
        pwHandler.dispose();
        term.write('\r\n');
        submitPassword(data.tabId, password, term, tabId, host, name, sshUser, sshPort, cols, rows);
      } else if (ch === '\x7f') {
        password = password.slice(0,-1);
      } else {
        password += ch;
        term.write('*');
      }
    });
    return;
  }

  // Open WebSocket for terminal I/O
  connectWebSocket(data.tabId, term, tabId, host, name, sshUser, sshPort, cols, rows);
};

async function submitPassword(sshTabId, password, term, tabId, host, name, user, port, cols, rows) {
  const res = await fetch('/api/ssh/auth-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ tabId: sshTabId, password })
  });
  if (!res.ok) {
    term.write(`\x1b[31m Authentication failed\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  connectWebSocket(sshTabId, term, tabId, host, name, user, port, cols, rows);
}

function connectWebSocket(sshTabId, term, tabId, host, name, user, port, cols, rows) {
  term.write(`\x1b[2m Connected.\x1b[0m\r\n\r\n`);
  const ws = new WebSocket(`ws://${location.host}/api/ssh/ws?tab=${sshTabId}&cols=${cols}&rows=${rows}&token=${TOKEN}`);

  ws.onopen = () => {
    term.loadAddon(new AttachAddon(ws));
    // Send initial resize
    ws.send(JSON.stringify({type:'resize', cols, rows}));
  };

  ws.onclose = () => {
    term.write('\r\n\x1b[2m[Connection closed]\x1b[0m\r\n');
    showReconnect(term, tabId, host, name, user, port);
  };

  ws.onerror = () => {
    term.write('\r\n\x1b[31m[WebSocket error]\x1b[0m\r\n');
  };

  // Handle terminal resize → send to server
  term.onResize(({cols, rows}) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type:'resize', cols, rows}));
    }
  });
}

function showReconnect(term, tabId, host, name, user, port) {
  term.write('\r\n\x1b[2m Press Enter to reconnect...\x1b[0m');
  const handler = term.onData(ch => {
    if (ch === '\r' || ch === '\n') {
      handler.dispose();
      term.clear();
      // Reconnect
      reconnectTerminal(tabId, host, name, user, port, term);
    }
  });
}

async function reconnectTerminal(tabId, host, name, user, port, term) {
  term.write(`\x1b[2m Reconnecting to ${user}@${host}:${port}...\x1b[0m\r\n`);
  const cols = term.cols, rows = term.rows;
  let res;
  try {
    res = await fetch('/api/ssh/connect', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ host, user, port, cols, rows })
    });
  } catch(err) {
    term.write(`\x1b[31m ${err.message}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  if (!res.ok) {
    term.write(`\x1b[31m ${await res.text()}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  const data = await res.json();
  if (data.tabId) connectWebSocket(data.tabId, term, tabId, host, name, user, port, cols, rows);
}

window.openBrowser = function(url, name) {
  document.getElementById('peer-menu').classList.remove('show');
  let navUrl = url;
  if (!/^https?:\/\//.test(navUrl)) navUrl = 'http://' + navUrl;

  // Browser tabs are real WebView2 navigations managed by Go.
  // Do not create shell panels/iframes for external pages.
  if (window.womprat_newBrowser) {
    womprat_newBrowser(navUrl);
  } else {
    location.href = navUrl;
  }
};

window.closeTab = function(id, e) {
  e.stopPropagation();
  state.tabs = state.tabs.filter(t => t.id !== id);
  saveOpenTabs(); updateHomeVisibility();
  document.getElementById(`panel-${id}`)?.remove();
  renderTabs();
  if (state.activeTab === id && state.tabs.length) activateTab(state.tabs[0].id);
};

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  const existing = bar.querySelectorAll('.tab');
  existing.forEach(el => el.remove());
  const plus = document.getElementById('new-tab');
  state.tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = `tab${tab.id === state.activeTab ? ' active' : ''}`;
    el.onclick = () => activateTab(tab.id);
    el.innerHTML = `${icon(tab.type === 'terminal' ? 'terminal' : tab.type === 'settings' ? 'settings' : 'globe')} <span class="tab-title">${tab.title}</span> <span class="tab-close" onclick="closeTab('${tab.id}',event)" title="Close">${icon('dismiss')}</span>`;
    bar.insertBefore(el, plus);
  });
}

function activateTab(id) {
  state.activeTab = id;
  const tab = state.tabs.find(t => t.id === id);
  if (!tab) return;

  // External browser tabs must never be represented as shell iframes.
  if (tab.type === 'browser') {
    if (window.womprat_newBrowser) womprat_newBrowser(tab.url || tab.title || 'about:blank');
    else location.href = tab.url || tab.title || 'about:blank';
    return;
  }

  // Update URL bar with active local tab's address
  const urlInput = document.getElementById('url-input');
  if (urlInput) {
    if (tab.type === 'terminal') urlInput.value = 'ssh://' + (tab.user||'root') + '@' + (tab.host||'') + ':' + (tab.port||22);
    else if (tab.type === 'settings') urlInput.value = '/settings.html';
    else urlInput.value = '';
  }

  const panels = document.getElementById('panels');
  // Create panel if it doesn't exist. Only local content is allowed here.
  if (!document.getElementById(`panel-${id}`)) {
    const panel = document.createElement('div');
    panel.id = `panel-${id}`;
    if (tab.type === 'terminal') {
      panel.className = 'panel term-panel';
      panel.innerHTML = '<div class="term-container" style="flex:1"></div>';
    } else if (tab.type === 'settings') {
      panel.className = 'panel browser-panel';
      panel.innerHTML = '<iframe class="browser-frame" src="/settings.html"></iframe>';
    } else {
      return;
    }
    panels.appendChild(panel);
  }
  // Show active panel, hide others
  panels.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${id}`).classList.add('active');
  renderTabs();
}

window.historyBack = function() { history.back(); };
window.historyForward = function() { history.forward(); };
window.historyReload = function() { location.reload(); };

window.navigateFromBar = function() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  const sshMatch = url.match(/^ssh:\/\/(?:([^@]+)@)?([^:\/]+)(?::(\d+))?/);
  if (sshMatch) {
    const user = sshMatch[1] || 'root';
    const host = sshMatch[2];
    const port = sshMatch[3] ? parseInt(sshMatch[3]) : 22;
    openTerminal(host, host, user, port);
    return;
  }
  let navUrl = url;
  if (!/^https?:\/\//.test(navUrl)) navUrl = 'http://' + navUrl;
  // External browsing is direct WebView2 navigation, never a shell iframe.
  if (window.womprat_navigate) womprat_navigate(navUrl);
  else location.href = navUrl;
};

window.navigateTab = function(id) {
  // Legacy entrypoint kept for old handlers; route through persistent URL bar.
  navigateFromBar();
};

window.openSettings = function() {
  const tabId = 'settings';
  if (!state.tabs.find(t => t.id === tabId)) {
    state.tabs.push({ id: tabId, type: 'settings', title: 'Settings', url: '/settings.html' });
    renderTabs();
  }
  activateTab(tabId);
};

async function loadRecentTabs() {
  try {
    const res = await fetch('/api/settings/config');
    const cfg = await res.json();
    const list = document.getElementById('recent-list');
    const tabs = cfg.openTabs || [];
    if (!tabs.length) {
      list.innerHTML = '<div style="color:var(--dim);font-size:.85em">No recent tabs</div>';
      return;
    }
    list.innerHTML = tabs.map(t => `
      <div class="recent-item" onclick="${t.type==='terminal'
        ? `openTerminal('${t.host}','${t.title}','${t.user||'root'}',${t.port||22})`
        : `openBrowser('${t.url}','${t.title}')`}">
        <span>${icon(t.type === 'terminal' ? 'terminal' : 'globe')}</span>
        <span style="font-weight:600">${t.title}</span>
        <span style="color:var(--dim);font-size:.8em;margin-left:auto">${t.type==='terminal' ? (t.user||'root') + '@' + t.host + ':' + (t.port||22) : t.url}</span>
      </div>
    `).join('');
  } catch {}
}

// Save tabs on changes
function saveOpenTabs() {
  const tabs = state.tabs.filter(t => t.id !== 'settings').map(t => ({
    type: t.type, title: t.title,
    host: t.host || '', user: t.user || '', url: t.url || ''
  }));
  fetch('/api/settings/save-tabs', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({tabs})
  }).catch(() => {});
}

// Show/hide home panel
function updateHomeVisibility() {
  const home = document.getElementById('panel-home');
  if (state.tabs.length === 0) {
    home.style.display = 'flex';
  } else {
    home.style.display = 'none';
  }
}

// Download handling — intercept download links in iframes
window.triggerDownload = async function(url) {
  const bar = document.getElementById('download-bar');
  const fname = document.getElementById('dl-filename');
  const prog = document.getElementById('dl-progress');
  const status = document.getElementById('dl-status');
  
  bar.classList.add('active');
  fname.textContent = url.split('/').pop() || 'download';
  status.textContent = 'Starting...';
  prog.style.width = '0%';
  
  await fetch('/api/download?url=' + encodeURIComponent(url));
  
  // Poll progress
  const poll = setInterval(async () => {
    const res = await fetch('/api/download/status');
    const d = await res.json();
    if (d.status === 'downloading') {
      const pct = d.size > 0 ? Math.round(d.done / d.size * 100) : 0;
      prog.style.width = pct + '%';
      fname.textContent = d.filename;
      status.textContent = d.size > 0 ? Math.round(d.done/1024) + ' / ' + Math.round(d.size/1024) + ' KB' : Math.round(d.done/1024) + ' KB';
    } else if (d.status === 'complete') {
      clearInterval(poll);
      prog.style.width = '100%';
      status.textContent = 'Saved to Downloads';
      setTimeout(() => bar.classList.remove('active'), 4000);
    } else if (d.status === 'error') {
      clearInterval(poll);
      status.textContent = 'Error: ' + d.error;
      setTimeout(() => bar.classList.remove('active'), 5000);
    }
  }, 500);
};

// Listen for messages from iframes requesting downloads
window.addEventListener('message', (e) => {
  if (e.data?.type === 'download' && e.data.url) {
    triggerDownload(e.data.url);
  }
});
checkAuth();
loadRecentTabs();
