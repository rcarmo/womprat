<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>womprat</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
@font-face {
  font-family: 'FiraCode Nerd Font Mono';
  src: url('fonts/FiraCodeNerdFontMono-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: block;
}
@font-face {
  font-family: 'FiraCode Nerd Font Mono';
  src: url('fonts/FiraCodeNerdFontMono-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: block;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --shell-content-zoom:1;
  --bg:#202020;
  --surface:rgba(32,32,32,.7);
  --surface-solid:#2d2d2d;
  --card:#2d2d2d;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --text:#fff;
  --text-secondary:rgba(255,255,255,.78);
  --dim:rgba(255,255,255,.55);
  --accent:#60cdff;
  --accent-hover:rgba(96,205,255,.15);
  --subtle-hover:rgba(255,255,255,.06);
  --subtle-pressed:rgba(255,255,255,.04);
  --layer:rgba(255,255,255,.05);
  --radius:4px;
  --radius-lg:8px;
  --tab-h:40px;
  --url-h:44px;
  --control-h:32px;
  --font:'Segoe UI Variable','Segoe UI',system-ui,-apple-system,sans-serif;
}
html{font-size:100%;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* Fluent reveal hover effect */
button,a,.tab,.recent-item,.option{
  transition:background .1s,border-color .15s,color .1s}
.fluent-icon{width:20px;height:20px;display:inline-block;flex:0 0 20px;color:currentColor;vertical-align:middle}
.fluent-icon svg{width:100%;height:100%;display:block}
.tab-icon-slot{width:20px;height:20px;flex:0 0 20px;display:inline-flex;align-items:center;justify-content:center}
.tab-favicon{width:16px;height:16px;flex:0 0 16px;object-fit:contain;border-radius:2px;vertical-align:middle}
.icon-button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--text-secondary);
  cursor:pointer;padding:0;flex:0 0 auto}
.icon-button:hover{background:var(--subtle-hover);color:var(--text)}

/* Tab bar — Fluent */
#tab-bar{display:flex;height:var(--tab-h);background:var(--surface-solid);
  border-bottom:1px solid var(--border);
  -webkit-app-region:drag;user-select:none;align-items:center;padding:0 8px;gap:6px;min-width:0}
#tab-list{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;flex:0 1 auto}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;height:32px;border-radius:var(--radius);
  cursor:pointer;color:var(--dim);font-weight:400;-webkit-app-region:no-drag;line-height:32px;font-size:14px;min-width:0;flex:0 1 220px;max-width:240px}
.tab.dragging{opacity:.45}
.tab.drag-over{background:var(--subtle-hover);border:1px solid var(--border-strong)}
.tab:hover{background:var(--subtle-hover);color:var(--text)}
.tab.active{background:var(--layer);color:var(--text);font-weight:600}
.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
.tab-close{margin-left:4px;opacity:.55;color:var(--dim);cursor:pointer;border:0;background:transparent;padding:0;border-radius:4px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px}
.tab-close .fluent-icon{width:16px;height:16px}
.tab-close:hover{opacity:1;color:var(--text);background:var(--subtle-hover)}
#new-tab{width:32px;height:32px;-webkit-app-region:no-drag;flex:0 0 32px}
#new-tab .fluent-icon{width:20px;height:20px}

/* Panels */
#panels{position:absolute;inset:calc(var(--tab-h) + var(--url-h)) 0 0 0}
#panels > .panel{zoom:var(--shell-content-zoom)}
#panels > .term-panel{zoom:1}
.panel{position:absolute;inset:0;display:none}
.panel.active{display:flex;flex-direction:column}

/* Terminal panel */
.term-panel{min-height:0;background:#202020}
.term-panel .term-container{flex:1;min-height:0;width:100%;height:100%;display:flex;overflow:hidden;background:#202020;padding:4px 6px}
.term-panel .xterm{flex:1;width:100%;height:100%;padding:0}
.term-panel .xterm .xterm-viewport,
.term-panel .xterm .xterm-screen{background:transparent!important}
/* xterm uses the VS Code scrollable-element overlay scrollbar. Its width comes
   from the overviewRuler.width terminal option (2px). Take deterministic control
   of fade: hidden on idle, shown while scrolling (panel .scrolling class) or on
   hover. The slider height stays proportional to the viewport vs scrollback. */
.term-panel .xterm .xterm-scrollable-element>.scrollbar{opacity:0!important;transition:opacity .4s ease!important}
.term-panel.scrolling .xterm .xterm-scrollable-element>.scrollbar,
.term-panel .xterm .xterm-scrollable-element>.scrollbar:hover{opacity:1!important;transition:opacity .1s ease!important}
.term-panel .xterm .xterm-scrollable-element>.scrollbar>.slider{background:rgba(255,255,255,.32)!important;border-radius:2px!important}
.term-panel .xterm .xterm-scrollable-element>.scrollbar:hover>.slider{background:rgba(255,255,255,.5)!important}
/* overviewRuler.width also enables a decoration canvas pinned at right:0 that
   shows a faint 1px line; we only use the option to size the scrollbar, so hide it. */
.term-panel .xterm .xterm-decoration-overview-ruler{display:none!important}

/* Local panels */
.browser-panel{flex-direction:column}
.browser-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:.85em;pointer-events:none}
.browser-frame{flex:1;border:none}
.vnc-panel{flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#111318 0%,#08090d 100%);color:var(--text)}
.vnc-toolbar{height:36px;display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--surface-solid);color:var(--text-secondary);font-size:12px}
.vnc-status{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vnc-status::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px rgba(96,205,255,.12)}
.vnc-panel[data-busy] .vnc-status::before{animation:vncPulse 1.2s ease-in-out infinite;background:#f2c94c}
.vnc-field{height:24px;background:var(--layer);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:0 8px;font:12px var(--font);outline:none;color-scheme:dark}
.vnc-field:focus{border-color:var(--accent);background:var(--bg)}
.vnc-password{margin-left:auto;width:128px}
.vnc-clipboard{min-width:160px;max-width:360px;width:28vw}
.vnc-send,.vnc-copy,.vnc-paste,.vnc-reconnect,.vnc-scale{height:24px;min-width:52px;padding:0 10px;font-size:12px;font-weight:600}
.vnc-viewport{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.06),transparent 42%),#050609}
.vnc-viewport canvas{display:block;image-rendering:pixelated;background:#000;border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.45);outline:none}
.vnc-viewport canvas:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,205,255,.22),0 8px 30px rgba(0,0,0,.45)}
.rdp-panel{flex:1;display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#111318 0%,#08090d 100%);color:var(--text)}
.rdp-toolbar{height:36px;display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--border);background:var(--surface-solid);color:var(--text-secondary);font-size:12px}
.rdp-status{display:inline-flex;align-items:center;gap:6px;min-width:130px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rdp-status::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px rgba(96,205,255,.12)}.rdp-panel[data-busy] .rdp-status::before{animation:vncPulse 1.2s ease-in-out infinite;background:#f2c94c}
.rdp-caps{min-width:120px;max-width:24vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.rdp-field{height:24px;background:var(--layer);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:0 8px;font:12px var(--font);outline:none;color-scheme:dark}.rdp-field:focus{border-color:var(--accent);background:var(--bg)}
.rdp-host{margin-left:auto;width:170px}.rdp-user{width:110px}.rdp-password{width:118px}.rdp-depth{width:74px}.rdp-toggle{display:inline-flex;align-items:center;gap:4px;height:24px;color:var(--text-secondary);white-space:nowrap}.rdp-toggle input{accent-color:var(--accent)}.rdp-connect,.rdp-scale{height:24px;min-width:52px;padding:0 10px;font-size:12px;font-weight:600}
.rdp-viewport{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.06),transparent 42%),#050609}.rdp-viewport canvas{display:block;background:#000;border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.45);outline:none}.rdp-viewport canvas:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(96,205,255,.22),0 8px 30px rgba(0,0,0,.45)}
@keyframes vncPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* Setup screen */
#setup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:100}
#setup.hidden{display:none}
.setup-card{background:var(--card);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:2rem;width:min(400px,90vw);text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.4)}
.setup-card h2{font-size:1.2rem;margin-bottom:.5rem}
.setup-card p{color:var(--dim);font-size:.85rem;margin-bottom:1.2rem;line-height:1.5}
.setup-card input{width:100%;padding:.6rem .8rem;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-family:monospace;font-size:.85rem;margin-bottom:.8rem}
.setup-card button{background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:.55rem 1.2rem;font-weight:600;cursor:pointer;font-size:.85rem}
.setup-card .status{margin-top:.8rem;font-size:.82rem;color:var(--dim)}

/* Peer list (new tab menu) */

#url-bar{display:flex;gap:6px;height:var(--url-h);padding:6px 8px;background:var(--surface-solid);
  border-bottom:1px solid var(--border);align-items:center;position:relative;z-index:10}
#url-bar input{flex:1;min-width:0;height:var(--control-h);background:var(--layer);border:1px solid var(--border);border-radius:var(--radius);
  padding:0 10px;color:var(--text);font-family:var(--font);font-size:14px;line-height:var(--control-h);outline:none;color-scheme:dark}
#url-bar input:focus{border-color:var(--accent);background:var(--bg)}
#url-bar button{height:var(--control-h)}
#url-bar .icon-button{min-width:32px;padding:0}
#url-bar .text-button{min-width:44px;padding:0 12px;font-size:14px;font-weight:600;line-height:var(--control-h)}
#url-bar .fluent-icon{width:20px;height:20px}
.route-pill{display:none;align-items:center;height:22px;max-width:150px;padding:0 7px;border-radius:999px;
  border:1px solid var(--border);background:var(--layer);color:var(--dim);
  font-size:11px;font-weight:600;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.route-pill.active{display:inline-flex}

.recent-item{display:flex;align-items:center;gap:.6rem;padding:.65rem .85rem;
  border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:.85em}
.recent-item:hover{background:var(--subtle-hover);border-color:var(--border-strong)}

#download-bar{position:fixed;bottom:0;left:0;right:0;height:2.5em;
  background:var(--surface-solid);border-top:1px solid var(--border);
  display:none;align-items:center;padding:0 1rem;gap:.8rem;font-size:.82em;z-index:60}
#download-bar.active{display:flex}
#download-bar .filename{font-weight:600;color:var(--text)}
#download-bar .progress{flex:1;height:4px;background:var(--layer);border-radius:2px;overflow:hidden}
#download-bar .progress-fill{height:100%;background:var(--accent);transition:width .2s}
#download-bar .status{color:var(--dim)}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h2>womprat</h2>
    <p id="setup-help">Enter your Tailscale auth key to connect.<br>It will be saved encrypted for this Windows user.</p>
    <input id="auth-key" type="password" placeholder="tskey-auth-..." maxlength="4096">
    <input id="unlock-password" type="password" placeholder="Master password" style="display:none" maxlength="4096">
    <button id="setup-action">Connect</button>
    <div class="status" id="setup-status"></div>
  </div>
</div>

<div id="tab-bar">
  <div id="tab-list" aria-label="Open tabs"></div>
  <button id="new-tab" class="icon-button" title="New tab" aria-label="New tab" data-icon="add"></button>
  <div id="tab-trailing-controls" style="display:flex;gap:4px;flex:0 0 auto;margin-left:auto">
    <button id="settings-btn" class="icon-button" title="Settings" aria-label="Settings" data-icon="settings"></button>
  </div>
</div>

<div id="url-bar">
  <button id="nav-back" class="icon-button" title="Back" aria-label="Back" data-icon="arrowLeft"></button>
  <button id="nav-forward" class="icon-button" title="Forward" aria-label="Forward" data-icon="arrowRight"></button>
  <button id="nav-reload" class="icon-button" title="Reload" aria-label="Reload" data-icon="arrowClockwise"></button>
  <input id="url-input" list="url-history" placeholder="Enter URL, ssh://user@host, vnc://host or rdp://user@host">
  <datalist id="url-history"></datalist>
  <span id="route-pill" class="route-pill" title="Exit node route status"></span>
  <button id="url-go" class="icon-button text-button">Go</button>
</div>

<div id="panels">
<!-- Home panel (shown when no tabs active) -->
<div class="panel active" id="panel-home">
  <div style="padding:2rem;max-width:500px;margin:0 auto">
    <h2 style="font-size:1.1em;margin-bottom:1rem;color:var(--dim)">Recent</h2>
    <div id="recent-list" style="display:flex;flex-direction:column;gap:.4rem"></div>
    <div style="margin-top:1.5rem;color:var(--dim);font-size:.82em">
      Use <kbd style="padding:2px 6px;background:var(--surface);border:1px solid var(--border);border-radius:4px">New tab</kbd> to enter a URL, or manage tailnet host URLs in Settings.
    </div>
  </div>
</div>
</div>

<script>
// Session auth token (injected by server)
const TOKEN = window.__SESSION_TOKEN || '';
const _fetch = window.fetch;
window.fetch = (url, opts = {}) => {
  opts.headers = opts.headers || {};
  if (typeof opts.headers === 'object' && !(opts.headers instanceof Headers)) {
    opts.headers['X-Session-Token'] = TOKEN;
  }
  return _fetch(url, opts);
};
</script>

async function submitPassword(sshTabId, password, term, tabId, host, name, user, port, cols, rows) {
  let res;
  try {
    res = await fetch('/api/ssh/auth-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tabId: sshTabId, password })
    });
  } catch (err) {
    term.write(`\x1b[31m Authentication failed: ${err.message}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  if (!res.ok) {
    term.write(`\x1b[31m Authentication failed\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  connectWebSocket(sshTabId, term, tabId, host, name, user, port, cols, rows);
}

function connectWebSocket(sshTabId, term, tabId, host, name, user, port, cols, rows) {
  cols = clampTerminalCols(cols);
  rows = clampTerminalRows(rows);
  term.write(`\x1b[2m Connected.\x1b[0m\r\n\r\n`);
  const params = new URLSearchParams({ tab: String(sshTabId || ''), cols: String(cols), rows: String(rows), token: TOKEN });
  const ws = new WebSocket(`ws://${location.host}/api/ssh/ws?${params.toString()}`);
  const session = terminalSessions.get(tabId);
  if (session) session.ws = ws;

  ws.onopen = () => {
    term.loadAddon(new AttachAddon(ws));
    // Send initial resize
    ws.send(JSON.stringify({type:'resize', cols, rows}));
  };

  ws.onclose = () => {
    term.write('\r\n\x1b[2m[Connection closed]\x1b[0m\r\n');
    showReconnect(term, tabId, host, name, user, port);
  };

  ws.onerror = () => {
    term.write('\r\n\x1b[31m[WebSocket error]\x1b[0m\r\n');
  };

  // Handle terminal resize → send to server
  term.onResize(({cols, rows}) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type:'resize', cols: clampTerminalCols(cols), rows: clampTerminalRows(rows)}));
    }
  });
}

function showReconnect(term, tabId, host, name, user, port) {
  term.write('\r\n\x1b[2m Press Enter to reconnect...\x1b[0m');
  const handler = term.onData(ch => {
    if (ch === '\r' || ch === '\n') {
      handler.dispose();
      term.clear();
      // Reconnect
      reconnectTerminal(tabId, host, name, user, port, term);
    }
  });
}

async function reconnectTerminal(tabId, host, name, user, port, term) {
  term.write(`\x1b[2m Reconnecting to ${user}@${host}:${port}...\x1b[0m\r\n`);
  const cols = clampTerminalCols(term.cols), rows = clampTerminalRows(term.rows);
  let res;
  try {
    res = await fetch('/api/ssh/connect', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ host, user, port, cols, rows })
    });
  } catch(err) {
    term.write(`\x1b[31m ${err.message}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  if (!res.ok) {
    term.write(`\x1b[31m ${await res.text()}\x1b[0m\r\n`);
    showReconnect(term, tabId, host, name, user, port);
    return;
  }
  const data = await res.json();
  if (data.tabId) connectWebSocket(data.tabId, term, tabId, host, name, user, port, cols, rows);
}

window.openBrowser = function(url, name) {
  if (openSpecialURL(url)) return;
  const navUrl = normalizeBrowserURL(url);
  if (!navUrl) return;

  updateNetworkIndicator();
  setURLProgress(true);
  saveURLHistory(navUrl);
  focusContentArea();
  // Browser tabs are real WebView2 navigations managed by Go.
  // Do not create shell panels/iframes for external pages.
  if (window.womprat_newBrowser) {
    womprat_newBrowser(navUrl);
  } else {
    location.href = navUrl;
  }
};

window.closeTab = function(id, e) {
  e?.stopPropagation?.();
  const closingActive = state.activeTab === id;
  const closing = state.tabs.find(t => t.id === id);
  state.tabs = state.tabs.filter(t => t.id !== id);
  const terminalSession = terminalSessions.get(id);
  if (terminalSession) {
    try { terminalSession.ws?.close?.(); } catch (err) { console.warn('terminal websocket close failed', err); }
    try { terminalSession.term?.dispose?.(); } catch (err) { console.warn('terminal dispose failed', err); }
    terminalSessions.delete(id);
  }
  const panel = document.getElementById(`panel-${id}`);
  if (closing?.type === 'vnc') {
    const root = panel?.querySelector?.('.vnc-panel');
    try { root?.__wompratVncViewer?.dispose?.(); } catch (err) { console.warn('vnc dispose failed', err); }
  }
  if (closing?.type === 'rdp') {
    const root = panel?.querySelector?.('.rdp-panel');
    try { root?.__wompratRdp?.disconnect?.(); } catch (err) { console.warn('rdp disconnect failed', err); }
  }
  panel?.remove();

  if (closing?.type === 'settings') {
    if (window.womprat_forgetTab) womprat_forgetTab(id);
  } else if (window.womprat_closeTab) {
    womprat_closeTab(id);
  }

  saveOpenTabs();
  if (closingActive) state.activeTab = state.tabs[0]?.id || null;
  renderTabs();
  if (state.activeTab) activateTab(state.activeTab);
  else updateHomeVisibility();
};

function clampInt(value, min, max, fallback) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return fallback;
  return Math.max(min, Math.min(max, Math.floor(n)));
}
function clampTerminalCols(value) { return clampInt(value, MIN_TERMINAL_COLS, MAX_TERMINAL_COLS, 80); }
function clampTerminalRows(value) { return clampInt(value, MIN_TERMINAL_ROWS, MAX_TERMINAL_ROWS, 24); }
function sanitizeBrowserTitle(value) {
  const text = String(value || '').trim();
  return Array.from(text).slice(0, MAX_BROWSER_TITLE_RUNES).join('');
}
function sanitizeFaviconURL(value) {
  const v = String(value || '').trim();
  if (!v || v.length > MAX_FAVICON_URL_BYTES || failedFavicons.has(v)) return '';
  const u = safeURL(v);
  if (u && (u.protocol === 'http:' || u.protocol === 'https:') && u.hostname) return u.href;
  if (u && u.protocol === 'data:' && /^data:image\//i.test(v) && v.length <= 4096) return v;
  return '';
}
function tabIconName(tab) {
  return tab.type === 'terminal' || tab.type === 'vnc' || tab.type === 'rdp' ? 'terminal' : tab.type === 'settings' ? 'settings' : 'globe';
}
function tabIconElement(tab) {
  const slot = document.createElement('span');
  slot.className = 'tab-icon-slot';
  if (tab.type === 'browser') {
    const favicon = sanitizeFaviconURL(tab.favicon);
    if (favicon) {
      const img = document.createElement('img');
      img.className = 'tab-favicon';
      img.src = favicon;
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.addEventListener('error', () => { failedFavicons.add(img.src); slot.textContent = ''; slot.innerHTML = icon('globe'); });
      slot.appendChild(img);
      return slot;
    }
  }
  slot.innerHTML = icon(tabIconName(tab));
  return slot;
}

function renderTabs() {
  const list = document.getElementById('tab-list');
  if (!list) return;
  list.textContent = '';
  state.tabs.forEach(tab => {
    const el = document.createElement('div');
    el.className = `tab${tab.id === state.activeTab ? ' active' : ''}`;
    el.draggable = true;
    el.dataset.tabId = tab.id;
    el.onclick = (e) => {
      if (e.target?.closest?.('.tab-close')) return;
      activateTab(tab.id);
    };
    el.addEventListener('dragstart', (e) => {
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', tab.id);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.tab.drag-over').forEach(t => t.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); e.dataTransfer.dropEffect = 'move'; });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const fromId = e.dataTransfer.getData('text/plain');
      reorderTab(fromId, tab.id);
    });
    el.appendChild(tabIconElement(tab));
    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || '';
    el.appendChild(title);
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'tab-close';
    close.title = 'Close';
    close.setAttribute('aria-label', 'Close tab');
    close.innerHTML = icon('dismiss');
    const stopCloseEvent = (e) => { e.stopPropagation(); e.stopImmediatePropagation?.(); };
    const closeFromEvent = (e) => { e.preventDefault(); stopCloseEvent(e); closeTab(tab.id, e); };
    close.draggable = false;
    close.addEventListener('pointerdown', stopCloseEvent, true);
    close.addEventListener('mousedown', stopCloseEvent, true);
    close.addEventListener('dblclick', stopCloseEvent, true);
    close.addEventListener('click', closeFromEvent, true);
    el.appendChild(close);
    list.appendChild(el);
  });
}

function reorderTab(fromId, beforeId) {
  if (!validTabID(fromId) || !validTabID(beforeId) || fromId === beforeId) return;
  const fromIndex = state.tabs.findIndex(t => t.id === fromId);
  const beforeIndex = state.tabs.findIndex(t => t.id === beforeId);
  if (fromIndex < 0 || beforeIndex < 0) return;
  const [tab] = state.tabs.splice(fromIndex, 1);
  let insertAt = beforeIndex;
  if (fromIndex < beforeIndex) insertAt--;
  state.tabs.splice(insertAt, 0, tab);
  renderTabs();
  saveOpenTabs();
  if (window.womprat_reorderTab) womprat_reorderTab(fromId, beforeIndex);
}

          <label class="rdp-toggle" title="Use Network Level Authentication"><input data-rdp-nla type="checkbox" checked>NLA</label>

window.showBrowserTab = function(id, url, options = {}) {
  if (openSpecialURL(url)) return;
  const navUrl = url === 'about:blank' ? 'about:blank' : normalizeBrowserURL(url);
  if (!navUrl) return;
  let tab = state.tabs.find(t => t.id === id);
  if (!tab) {
    tab = { id, type: 'browser', title: navUrl, url: navUrl };
    state.tabs.push(tab);
  } else {
    tab.type = 'browser';
    tab.url = navUrl;
    tab.title = tab.title || navUrl;
  }
  renderTabs();
  activateTab(id, { skipNative: !!options.skipNative });

  saveURLHistory(navUrl);
  registerLocalTab(tab);
  saveOpenTabs();
};

window.historyBack = function() { if (window.womprat_browserBack) womprat_browserBack(); };
window.historyForward = function() { if (window.womprat_browserForward) womprat_browserForward(); };
window.historyReload = function() { if (window.womprat_browserReload) womprat_browserReload(); };

function focusAddress(selectAll = true) {
  const input = document.getElementById('url-input');
  if (!input) return;
  input.focus();
  if (selectAll) input.select();
}
function switchRelativeTab(delta) {
  if (!state.tabs.length) return;
  const idx = Math.max(0, state.tabs.findIndex(t => t.id === state.activeTab));
  const next = state.tabs[(idx + delta + state.tabs.length) % state.tabs.length];
  if (next) activateTab(next.id);
}
function switchTabAt(index) {
  if (!state.tabs.length) return;
  const target = state.tabs[Math.min(index, state.tabs.length - 1)];
  if (target) activateTab(target.id);
}
function closeActiveShellTab() {
  if (state.activeTab) closeTab(state.activeTab);
  else if (window.womprat_goHome) womprat_goHome();
}
function adjustActiveContentZoom(delta) {
  const session = terminalSessions.get(state.activeTab);
  if (session) {
    session.fontSize = Math.max(8, Math.min(30, Math.round((session.fontSize + delta * 10) * 10) / 10));
    session.term.options.fontSize = session.fontSize;
    session.fit.fit();
    return;
  }
  shellContentZoom = Math.round((shellContentZoom + delta) * 100) / 100;
  applyShellContentZoom();
}
function focusContentArea() {
  document.activeElement?.blur?.();
  const tab = state.tabs.find(t => t.id === state.activeTab);
  if (tab?.type === 'terminal') {
    terminalSessions.get(tab.id)?.term?.focus?.();
    return;
  }
  const panel = tab ? document.getElementById(`panel-${tab.id}`) : document.getElementById('panel-home');
  const target = panel?.querySelector?.('iframe, .term-container, input, button, [tabindex]') || panel || document.body;
  target?.focus?.();
}

function resetActiveContentZoom() {
  const session = terminalSessions.get(state.activeTab);
  if (session) {
    session.fontSize = TERMINAL_FONT_SIZE;
    session.term.options.fontSize = TERMINAL_FONT_SIZE;
    session.fit.fit();
    return;
  }
  shellContentZoom = 1;
  applyShellContentZoom();
}

function installShellControlHandlers() {
  document.getElementById('setup-action')?.addEventListener('click', saveKey);
  document.getElementById('new-tab')?.addEventListener('click', newBlankTab);
  document.getElementById('settings-btn')?.addEventListener('click', openSettings);
  document.getElementById('nav-back')?.addEventListener('click', () => historyBack(state.activeTab));
  document.getElementById('nav-forward')?.addEventListener('click', () => historyForward(state.activeTab));
  document.getElementById('nav-reload')?.addEventListener('click', () => historyReload(state.activeTab));
  document.getElementById('url-go')?.addEventListener('click', () => navigateFromBar());
  document.getElementById('url-input')?.addEventListener('keydown', (event) => { if (event.key === 'Enter') navigateFromBar(); });
}

function installBrowserHotkeys() {
  document.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    e.stopPropagation();
    adjustActiveContentZoom(e.deltaY < 0 ? 0.1 : -0.1);
  }, { capture: true, passive: false });

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    const active = state.tabs.find(t => t.id === state.activeTab);
    const terminalFocused = active?.type === 'terminal';
    if (terminalFocused) {
      if (ctrl && e.shiftKey && key === 'w') {
        e.preventDefault();
        if (Date.now() < (window.__wompratSuppressCloseShortcutUntil || 0)) return;
        closeActiveShellTab();
        return;
      }
      if (ctrl && e.shiftKey && key === 't') { e.preventDefault(); newBlankTab(); return; }
      if (ctrl && e.shiftKey && key === 'l') { e.preventDefault(); focusAddress(true); return; }
      if (ctrl && e.shiftKey && key === 'r') { e.preventDefault(); historyReload(state.activeTab); return; }
      if (ctrl && e.shiftKey && (key === 'tab' || key === 'pagedown')) { e.preventDefault(); switchRelativeTab(1); return; }
      if (ctrl && e.shiftKey && key === 'pageup') { e.preventDefault(); switchRelativeTab(-1); return; }
      if (ctrl && e.shiftKey && /^[1-9]$/.test(key)) { e.preventDefault(); switchTabAt(key === '9' ? 8 : Number(key) - 1); return; }
      return;
    }
    if (e.altKey && !ctrl && key === 'arrowleft') { e.preventDefault(); historyBack(); return; }
    if (e.altKey && !ctrl && key === 'arrowright') { e.preventDefault(); historyForward(); return; }
    if (key === 'f5' || (ctrl && key === 'r')) { e.preventDefault(); historyReload(); return; }
    if (ctrl && (key === '+' || key === '=')) { e.preventDefault(); adjustActiveContentZoom(0.1); return; }
    if (ctrl && (key === '-' || key === '_')) { e.preventDefault(); adjustActiveContentZoom(-0.1); return; }
    if (ctrl && key === '0') { e.preventDefault(); resetActiveContentZoom(); return; }
    if ((ctrl && key === 'l') || (e.altKey && !ctrl && key === 'd')) { e.preventDefault(); focusAddress(true); return; }
    if (ctrl && key === 't') { e.preventDefault(); newBlankTab(); return; }
    if (ctrl && key === 'w') { e.preventDefault(); closeActiveShellTab(); return; }
    if (ctrl && (key === 'tab' || key === 'pagedown')) { e.preventDefault(); switchRelativeTab(e.shiftKey ? -1 : 1); return; }
    if (ctrl && key === 'pageup') { e.preventDefault(); switchRelativeTab(-1); return; }
    if (ctrl && /^[1-9]$/.test(key)) { e.preventDefault(); switchTabAt(key === '9' ? 8 : Number(key) - 1); return; }
    if (e.altKey && !ctrl && key === 'home') { e.preventDefault(); newBlankTab(); return; }
  }, true);
}
installShellControlHandlers();
installBrowserHotkeys();

window.navigateFromBar = function() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  if (openSpecialURL(url)) return;
  const navUrl = normalizeBrowserURL(url);
  if (!navUrl) return;
  updateNetworkIndicator();
  setURLProgress(true);
  saveURLHistory(navUrl);
  focusContentArea();
  // External browsing is direct WebView2 navigation, never a shell iframe.
  const active = state.tabs.find(t => t.id === state.activeTab);
  const shouldCreateBrowserTab = !active || active.type !== 'browser';
  if (shouldCreateBrowserTab && window.womprat_newBrowser) womprat_newBrowser(navUrl);
  else if (window.womprat_navigate) womprat_navigate(navUrl);
  else location.href = navUrl;
};

window.navigateTab = function(id) {
  // Legacy entrypoint kept for old handlers; route through persistent URL bar.
  navigateFromBar();
};

window.openSettings = function() {
  const tabId = 'settings';
  if (!state.tabs.find(t => t.id === tabId)) {
    state.tabs.push({ id: tabId, type: 'settings', title: 'Settings', url: 'settings:' });
  }
  renderTabs();
  // Tell the native host to hide browser views and restore the full-height shell.
  if (window.womprat_openSettings) { try { womprat_openSettings(); } catch (err) { console.warn('native settings open failed', err); } }
  // Render the settings panel locally regardless of native timing.
  activateTab(tabId, { skipNative: true });
};

function activateRecentTab(tab) {
  if (!tab) return;
  if (tab.type === 'terminal') {
    saveURLHistory(formatSSHURL(tab.user || 'root', tab.host || tab.title, tab.port));
    openTerminal(tab.host || tab.title, tab.title || tab.host, tab.user || 'root', Number(tab.port || 22));
    return;
  }
  const url = tab.url || tab.title;
  if (url) {
    if (openSpecialURL(url)) return;
    const navUrl = normalizeBrowserURL(url);
    if (!navUrl) return;
    saveURLHistory(navUrl);
    openBrowser(navUrl, tab.title || url);
  }
}

    list.textContent = '';
    if (!tabs.length) {

      item.className = 'recent-item';
      item.tabIndex = 0;
      item.setAttribute('role', 'button');

      item.addEventListener('keydown', (e) => {

      });

      const iconSpan = document.createElement('span');

      if (favicon) {
        const img = document.createElement('img');
        img.className = 'tab-favicon';
        img.src = favicon;
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', () => { failedFavicons.add(img.src); img.remove(); });
        iconSpan.appendChild(img);
      } else {
        iconSpan.innerHTML = icon(t.type === 'terminal' ? 'terminal' : 'globe');
      }
      const title = document.createElement('span');
      title.style.fontWeight = '600';
      title.textContent = t.title || t.host || t.url || 'Untitled';
      const detailSpan = document.createElement('span');
      detailSpan.style.cssText = 'color:var(--dim);font-size:.8em;margin-left:auto';
      detailSpan.textContent = detail;
      item.append(iconSpan, title, detailSpan);
      list.appendChild(item);
    });
  } catch (err) {
    console.warn('recent tabs load failed', err);
    list.textContent = '';
    const item = document.createElement('div');
    item.style.cssText = 'color:var(--dim);font-size:.85em';
    item.textContent = 'Could not load recent tabs';
    list.appendChild(item);
  }
}

async function hydrateNativeTabs() {
  if (!window.womprat_getTabs) return;
  try {
    const native = JSON.parse(await womprat_getTabs());
    const localTabs = (native.tabs || []).map(t => {
      if (t?.type === 'settings' && validTabID(t.id)) return { id: 'settings', type: 'settings', title: 'Settings', url: 'settings:' };
      const clean = sanitizeTabForSave(t);
      return clean ? { ...clean, id: String(t.id) } : null;
    }).filter(Boolean);
    const requested = new URLSearchParams(location.search).get('tab') || '';
    const target = localTabs.find(t => t.id === requested && (t.type === 'terminal' || t.type === 'settings'));
    state.tabs = localTabs;
    state.activeTab = target ? target.id : null;
    renderTabs();
    updateHomeVisibility();
    if (target?.type === 'terminal') {
      await openTerminal(target.host, target.title || target.host, target.user || 'root', target.port || 22, { id: target.id, skipRegister: true });
    } else if (target?.type === 'settings') {
      if (!state.tabs.find(t => t.id === 'settings')) state.tabs.push(target);
      activateTab('settings');
    }
  } catch (err) { console.warn('native tab hydration failed', err); }
}

// Save tabs on changes
function sanitizeTabForSave(t) {
  if (!t || t.id === 'settings' || !validTabID(t.id)) return null;
  const type = String(t.type || '').toLowerCase();
  const base = { type, title: sanitizeBrowserTitle(t.title), host: String(t.host || ''), user: String(t.user || ''), port: Number(t.port || 0), url: String(t.url || ''), favicon: sanitizeFaviconURL(t.favicon) };
  if (type === 'browser') {
    const url = normalizeBrowserURL(base.url);
    if (!url) return null;
    base.url = url;
    return base;
  }
  if (type === 'terminal') return parseCustomURL(formatSSHURL(base.user || 'root', base.host || base.title, base.port)) ? base : null;
  if (type === 'vnc' || type === 'rdp') {
    const fallbackURL = `${type}://${base.user ? encodeURIComponent(base.user) + '@' : ''}${base.host}:${base.port || (type === 'vnc' ? 5900 : 3389)}`;
    const target = parseCustomURL(base.url || fallbackURL);
    if (!target || target.scheme !== type) return null;
    base.host = target.host;
    base.user = target.user;
    base.port = target.port;
    base.url = normalizedCustomURL(target);
    base.title = base.title || base.url;
    return base;
  }
  return null;
}
function saveOpenTabs() {
  const tabs = state.tabs.map(sanitizeTabForSave).filter(Boolean).slice(0, 100);
  fetch('/api/settings/save-tabs', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({tabs})
  }).catch(err => console.warn('save open tabs failed', err));
}

// Show/hide home panel
function updateHomeVisibility() {
  const home = document.getElementById('panel-home');
  if (!home) return;
  if (state.tabs.length === 0 || !state.activeTab) {
    home.style.display = 'flex';
    home.classList.add('active');
  } else {
    home.style.display = 'none';
    home.classList.remove('active');
  }
}

// Download handling — intercept download links in iframes
function downloadDisplayName(url) {
  try {
    const u = new URL(String(url || '').trim());
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    return decodeURLComponent(u.pathname.split('/').pop() || '') || 'download';
  } catch (err) { console.debug('download display name unavailable', err); return ''; }
}
window.triggerDownload = async function(url) {
  const bar = document.getElementById('download-bar');
  const fname = document.getElementById('dl-filename');
  const prog = document.getElementById('dl-progress');
  const status = document.getElementById('dl-status');
  const displayName = downloadDisplayName(url);
  if (!displayName) {
    bar.classList.add('active');
    fname.textContent = 'download';
    status.textContent = 'Invalid download URL';
    prog.style.width = '0%';
    return;
  }
  
  bar.classList.add('active');
  fname.textContent = displayName;
  status.textContent = 'Starting...';
  prog.style.width = '0%';
  
  const start = await fetch('/api/download?url=' + encodeURIComponent(url));
  if (!start.ok) {
    status.textContent = await start.text();
    return;
  }
  
  // Poll progress
  const poll = setInterval(async () => {
    let d;
    try {
      const res = await fetch('/api/download/status');
      if (!res.ok) throw new Error(await res.text());
      d = await res.json();
    } catch (err) {
      clearInterval(poll);
      status.textContent = 'Error: ' + err.message;
      setTimeout(() => bar.classList.remove('active'), 5000);
      return;
    }
    if (d.status === 'downloading') {
      const pct = d.size > 0 ? Math.round(d.done / d.size * 100) : 0;
      prog.style.width = pct + '%';
      fname.textContent = d.filename;
      status.textContent = d.size > 0 ? Math.round(d.done/1024) + ' / ' + Math.round(d.size/1024) + ' KB' : Math.round(d.done/1024) + ' KB';
    } else if (d.status === 'complete') {
      clearInterval(poll);
      prog.style.width = '100%';
      status.textContent = 'Saved to Downloads';
      setTimeout(() => bar.classList.remove('active'), 4000);
    } else if (d.status === 'error') {
      clearInterval(poll);
      status.textContent = 'Error: ' + d.error;
      setTimeout(() => bar.classList.remove('active'), 5000);
    }
  }, 500);
};

// Listen for messages from iframes requesting downloads
window.addEventListener('message', (e) => {
  if (e.data?.type === 'download' && e.data.url) {
    triggerDownload(e.data.url);
  }
});
window.addEventListener('load', () => { setURLProgress(false, true); wompratReportChrome(); });
document.addEventListener('readystatechange', () => {
  if (document.readyState === 'complete') setURLProgress(false, true);
});
window.addEventListener('resize', () => wompratReportChrome());
try { matchMedia('(resolution: 1dppx)').addEventListener('change', () => wompratReportChrome()); } catch (err) { console.warn('resolution listener install failed', err); }
wompratReportChrome();
setTimeout(wompratReportChrome, 300);
checkAuth();
loadRecentTabs();
hydrateNativeTabs();
setInterval(() => updateNetworkIndicator(false), 1500);
</script>

  <span class="filename" id="dl-filename"></span>
  <div class="progress"><div class="progress-fill" id="dl-progress" style="width:0%"></div></div>
  <span class="status" id="dl-status"></span>
</div>
